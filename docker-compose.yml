services:
  app:
    # Build từ Dockerfile Node trong bộ này (xem DEPLOY.md) — Dokploy build
    # image này từ repo rồi chạy, không pull image có sẵn.
    build:
      context: .
      dockerfile: Dockerfile
    image: di-choi-online:1.0.0
    environment:
      PORT: "4187"
      NODE_ENV: "production"
      # Mật khẩu panel — đặt giá trị thật trong phần Environment của Dokploy,
      # KHÔNG ghi mật khẩu thật vào file này.
      PANEL_KEY: "${PANEL_KEY}"
    volumes:
      # Cài đặt Quà & Du lịch (data/game-settings.json) không mất
      # mỗi lần redeploy.
      - di-choi-online-data:/app/data
    restart: unless-stopped

volumes:
  di-choi-online-data:
